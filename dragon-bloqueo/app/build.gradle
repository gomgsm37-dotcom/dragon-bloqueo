plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dragongsm.bloqueo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dragongsm.bloqueo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('dragon.keystore')
            storePassword 'dragon2026'
            keyAlias 'dragon'
            keyPassword 'dragon2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
